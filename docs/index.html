<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050507" />
  <title>The Master Catalogue — India & Global</title>
  <meta name="description" content="Live daily Top 10 across streaming services." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { oled: '#050507', panel: '#0c0c10' } } } }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root { --oled: #050507; --line: rgba(255,255,255,0.07); }
    html, body { background: var(--oled); color: #f4f4f5; font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 99px; }
    .glass { background: rgba(12,12,16,0.75); backdrop-filter: blur(16px); border-bottom: 1px solid var(--line); }
    .card { background: #0c0c10; border: 1px solid var(--line); transition: transform .15s ease; }
    .card:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.15); }
    .tab-active { background: rgba(255,255,255,0.1); color: #fff; font-weight: 600; border-color: rgba(255,255,255,0.2); }
    .tab-inactive { color: #71717a; border-color: transparent; }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const [data, setData] = useState(null);
  const [error, setError] = useState(false);
  const [activeTab, setActiveTab] = useState('IN'); // 'IN' for India, 'GLOBAL' for Global

  useEffect(() => {
    fetch('/expoitt-cinephile/daily_catalogue.json', { cache: 'no-store' })
      .then(res => { if (!res.ok) throw new Error(); return res.json(); })
      .then(json => setData(json))
      .catch(() => setError(true));
  }, []);

  if (error) return <div className="min-h-screen flex items-center justify-center text-zinc-500 font-mono">Catalogue not found.</div>;
  if (!data) return <div className="min-h-screen flex items-center justify-center text-zinc-500 font-mono">LOADING...</div>;

  // Filter platforms based on the active tab
  const isIndian = (platformName) => platformName.includes('India') || ['JioHotstar', 'SonyLIV', 'ZEE5'].includes(platformName);
  
  const visiblePlatforms = Object.keys(data.platforms).filter(p => {
    return activeTab === 'IN' ? isIndian(p) : !isIndian(p);
  });

  return (
    <div className="min-h-screen bg-oled">
      {/* HEADER */}
      <header className="glass sticky top-0 z-30 px-4 sm:px-6 py-4">
        <div className="max-w-[1600px] mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
          <div>
            <h1 className="text-lg font-extrabold tracking-tight">THE MASTER CATALOGUE</h1>
            <p className="text-[10px] text-zinc-500 font-mono">{data.date_label} • Live Daily Charts</p>
          </div>
          
          {/* TABS */}
          <div className="flex bg-white/5 rounded-xl p-1 border border-white/10">
            <button 
              onClick={() => setActiveTab('IN')}
              className={`px-6 py-2 rounded-lg text-sm transition border ${activeTab === 'IN' ? 'tab-active' : 'tab-inactive'}`}
            >
              India OTT
            </button>
            <button 
              onClick={() => setActiveTab('GLOBAL')}
              className={`px-6 py-2 rounded-lg text-sm transition border ${activeTab === 'GLOBAL' ? 'tab-active' : 'tab-inactive'}`}
            >
              Global OTT
            </button>
          </div>
        </div>
      </header>

      {/* CONTENT */}
      <main className="max-w-[1600px] mx-auto px-4 sm:px-6 py-8">
        {visiblePlatforms.map(platformName => {
          const items = data.platforms[platformName] || [];
          const metaStatus = items[0]?.status || 'BASELINE';
          
          return (
            <section key={platformName} className="mb-12">
              <div className="flex items-center justify-between mb-4">
                <h2 className="text-xl font-bold">{platformName}</h2>
                <span className={`text-[10px] font-mono px-2 py-1 rounded border ${metaStatus === 'LIVE' ? 'badge-live' : 'badge-baseline'}`}>
                  {metaStatus === 'LIVE' ? '⚡ LIVE' : '🛡️ BASELINE'}
                </span>
              </div>
              
              <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
                {items.map((item, idx) => (
                  <div key={idx} className="card rounded-xl p-4 flex flex-col justify-between h-32">
                    <div>
                      <div className="flex justify-between items-start">
                        <span className="text-2xl font-black text-zinc-600">#{item.rank || idx + 1}</span>
                      </div>
                      <p className="text-sm font-semibold leading-tight mt-2 clamp-2" title={item.title}>{item.title}</p>
                    </div>
                  </div>
                ))}
              </div>
            </section>
          );
        })}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
