name: Master Catalogue Daily Sync

on:
  schedule:
    - cron: "0 0 * * *"          # 00:00 UTC = 05:30 IST
  workflow_dispatch:              # manual trigger for validation

permissions:
  contents: write                 # required to commit history + catalogue

concurrency:
  group: master-catalogue-sync
  cancel-in-progress: false       # never kill an in-flight sync halfway through

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run daily sync engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        run: python daily_sync.py

      - name: Commit updated catalogue + 30-day history
        run: |
          git config user.name  "master-catalogue-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/daily_catalogue.json public/history_index.json public/feed.xml public/og.svg
          if git diff --staged --quiet; then
            echo "No catalogue changes — skipping commit."
            exit 0
          fi
          git commit -m "chore(catalogue): daily sync $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push
